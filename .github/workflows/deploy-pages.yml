name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 依附錄 F 安全前提：Action 以 commit SHA 釘選、最小 permissions、不輸出環境變數
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 站內檢查未通過就不部署
      - name: Check site
        run: python3 .github/scripts/check_site.py

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # 只部署網站本體：手冊全文 docs/ 與 repo 管理檔案不對外發布
      - name: Assemble site (exclude docs/)
        run: |
          mkdir _site
          rsync -a --exclude='docs' --exclude='.git' --exclude='.github' \
                --exclude='_site' --exclude='README.md' ./ _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
